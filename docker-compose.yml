version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codetyhub_postgres
    restart: always
    environment:
      POSTGRES_DB: codetyhub_db
      POSTGRES_USER: codetyhub_user
      POSTGRES_PASSWORD: codetyhub_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./node-bridge/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
